<!doctype html>
<html lang="en" data-theme="dark" data-scene-scroll class="m-0 h-full overflow-x-clip bg-scene text-scene-ink motion-safe:data-scene-scroll:overflow-y-hidden motion-safe:data-scene-scroll:overscroll-y-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f2f2f2'
        }
      } catch {
        // Storage may be blocked; keep the dark default.
      }
    </script>
    <meta name="description" content="Gianlucca “lvsk” Claudino — Creative Technologist, Frontend Specialist, Product Engineer." />
    <title>Gianlucca “lvsk” Claudino</title>
    <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/redaction-35-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/redaction-35-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="m-0 h-full overflow-x-clip font-mono antialiased [text-rendering:optimizeLegibility]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
